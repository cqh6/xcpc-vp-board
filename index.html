<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICPC/CCPC VP 榜单系统</title>
<script src="https://unpkg.com/vue@3"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; }
.app { max-width: 720px; margin: 0 auto; padding: 48px 20px 32px; }

.hero { text-align: center; margin-bottom: 40px; }
.hero-icon { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #0071e3, #34a4ff); margin-bottom: 16px; box-shadow: 0 4px 12px rgba(0,113,227,.25); }
.hero-icon svg { width: 28px; height: 28px; fill: #fff; }
.hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
.hero h1 span { background: linear-gradient(135deg, #0071e3, #34a4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero .subtitle { color: #86868b; font-size: 15px; line-height: 1.5; }

.loading { text-align: center; padding: 80px 0; color: #86868b; }
.loading .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #d2d2d7; border-top-color: #0071e3; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.tree { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06), 0 0 1px rgba(0,0,0,.04); overflow: hidden; }
.tree-node { border-bottom: 1px solid #f0f0f0; }
.tree-node:last-child { border-bottom: none; }
.node-header { display: flex; align-items: center; padding: 13px 18px; cursor: pointer; user-select: none; transition: background .15s; }
.node-header:hover { background: #f8f8fa; }
.node-arrow { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; margin-right: 8px; flex-shrink: 0; color: #86868b; transition: transform .2s, color .2s; font-size: 10px; }
.node-arrow.expanded { transform: rotate(90deg); color: #0071e3; }
.node-arrow.leaf { visibility: hidden; }
.node-label { font-size: 15px; font-weight: 600; color: #1d1d1f; }
.node-label.leaf-label { font-weight: 400; }
.node-count { margin-left: auto; font-size: 12px; color: #0071e3; background: rgba(0,113,227,.08); padding: 3px 10px; border-radius: 10px; margin-right: 4px; font-weight: 500; }
.node-children .node-count { color: #5eb3ff; background: rgba(94,179,255,.12); }
.node-children { padding-left: 28px; }

.leaf-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
.leaf-actions button { font-size: 12px; padding: 5px 14px; border: none; border-radius: 8px; cursor: pointer; transition: all .2s; font-weight: 500; }
.btn-vp { background: #0071e3; color: #fff; }
.btn-vp:hover { background: #005bb5; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,113,227,.3); }
.btn-final { background: #f0f0f5; color: #1d1d1f; }
.btn-final:hover { background: #e5e5ea; }

.footer { text-align: center; margin-top: 28px; color: #86868b; font-size: 13px; }
.footer a { color: #0071e3; text-decoration: none; }
.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app" class="app">
  <div class="hero">
    <div class="hero-icon"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M17 2H7v5a5 5 0 005 5 5 5 0 005-5V2z" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M7 2H5a2 2 0 00-2 2v1a3 3 0 003 3M17 2h2a2 2 0 012 2v1a3 3 0 01-3 3" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M10 12v3a2 2 0 004 0v-3" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M8 17h8M10 19h4M11 21h2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div>
    <h1>ICPC / CCPC <span>VP</span> 榜单</h1>
    <p class="subtitle">选择一场比赛，开始 Virtual Participation 或查看最终榜单</p>
  </div>

  <div v-if="loading" class="loading">
    <div class="spinner"></div>
    <p style="margin-top:14px">正在加载比赛列表…</p>
  </div>

  <div v-else-if="error" class="loading">
    <p style="color:#e23648">加载失败: {{ error }}</p>
  </div>

  <div v-else class="tree">
    <tree-node v-for="node in treeData" :key="node.path" :node="node"></tree-node>
  </div>

  <div class="footer">数据来源: <a href="https://github.com/algoux/srk-collection" target="_blank">algoux/srk-collection</a></div>
</div>

<script>
const CDN = 'https://cdn.jsdelivr.net/gh/algoux/srk-collection@master/';

const { createApp, ref, computed } = Vue;

const app = createApp({
  setup() {
    const loading = ref(true);
    const error = ref('');
    const treeData = ref([]);

    async function loadConfig() {
      try {
        const resp = await fetch(CDN + 'official/config.yaml', { cache: 'force-cache' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        const yaml = jsyaml.load(text);
        treeData.value = buildTree(yaml.root.children || [], '');
      } catch (e) {
        error.value = e.message;
      } finally {
        loading.value = false;
      }
    }

    function buildTree(children, parentPath) {
      return children.map(item => {
        const path = parentPath ? parentPath + '/' + item.path : item.path;
        const isLeaf = item.format === 'srk.json';
        const node = { name: item.name, path, isLeaf, children: [], count: 0 };
        if (item.children) {
          node.children = buildTree(item.children, path);
          node.count = countLeaves(node.children);
        }
        if (isLeaf) {
          node.filePath = 'official/' + path;
          node.count = 1;
        }
        return node;
      });
    }

    function countLeaves(nodes) {
      let c = 0;
      for (const n of nodes) { c += n.isLeaf ? 1 : countLeaves(n.children); }
      return c;
    }

    loadConfig();

    return { loading, error, treeData };
  }
});

app.component('tree-node', {
  props: ['node'],
  template: `
    <div class="tree-node">
      <div class="node-header" @click="toggle">
        <span class="node-arrow" :class="{ expanded: expanded, leaf: node.isLeaf }">&#9654;</span>
        <span class="node-label" :class="{ 'leaf-label': node.isLeaf }">{{ node.name }}</span>
        <span v-if="!node.isLeaf" class="node-count">{{ node.count }} 场</span>
        <span v-if="node.isLeaf" class="leaf-actions">
          <button class="btn-vp" @click.stop="goVP">开始 VP</button>
          <button class="btn-final" @click.stop="goFinal">最终榜单</button>
        </span>
      </div>
      <div v-if="expanded && node.children.length" class="node-children">
        <tree-node v-for="child in node.children" :key="child.path" :node="child"></tree-node>
      </div>
    </div>
  `,
  setup(props) {
    const expanded = ref(false);
    function toggle() { if (!props.node.isLeaf) expanded.value = !expanded.value; }
    function goVP() {
      const now = Date.now();
      window.location.href = 'board.html?comp=' + props.node.filePath + '&st=' + now;
    }
    function goFinal() {
      window.location.href = 'board.html?comp=' + props.node.filePath + '&st=0';
    }
    return { expanded, toggle, goVP, goFinal };
  }
});

app.mount('#app');
</script>
</body>
</html>
