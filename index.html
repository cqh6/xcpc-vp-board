<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICPC/CCPC VP 榜单系统</title>
<script src="https://unpkg.com/vue@3"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1d1d1f; min-height: 100vh; }
.app { max-width: 680px; margin: 0 auto; padding: 40px 20px; }
h1 { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: #86868b; margin-bottom: 32px; font-size: 14px; }

.loading { text-align: center; padding: 60px 0; color: #86868b; }
.loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #d2d2d7; border-top-color: #0071e3; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.tree { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
.tree-node { border-bottom: 1px solid #f0f0f0; }
.tree-node:last-child { border-bottom: none; }
.node-header { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; user-select: none; transition: background .15s; }
.node-header:hover { background: #f5f5f7; }
.node-arrow { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; margin-right: 8px; flex-shrink: 0; color: #86868b; transition: transform .2s; font-size: 12px; }
.node-arrow.expanded { transform: rotate(90deg); }
.node-arrow.leaf { visibility: hidden; }
.node-label { font-size: 15px; font-weight: 500; }
.node-label.leaf-label { font-weight: 400; color: #1d1d1f; }
.node-count { margin-left: auto; font-size: 12px; color: #86868b; background: #f0f0f5; padding: 2px 8px; border-radius: 10px; }
.node-children { padding-left: 28px; }

.leaf-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
.leaf-actions button { font-size: 12px; padding: 4px 10px; border: none; border-radius: 6px; cursor: pointer; transition: all .15s; font-weight: 500; }
.btn-vp { background: #0071e3; color: #fff; }
.btn-vp:hover { background: #0077ed; }
.btn-final { background: #e8e8ed; color: #1d1d1f; }
.btn-final:hover { background: #d2d2d7; }

.footer { text-align: center; margin-top: 32px; color: #86868b; font-size: 12px; }
</style>
</head>
<body>
<div id="app" class="app">
  <h1>ICPC / CCPC VP 榜单</h1>
  <p class="subtitle">选择一场比赛，开始 Virtual Participation 或查看最终榜单</p>

  <div v-if="loading" class="loading">
    <div class="spinner"></div>
    <p style="margin-top:12px">正在加载比赛列表…</p>
  </div>

  <div v-else-if="error" class="loading">
    <p style="color:#e23648">加载失败: {{ error }}</p>
  </div>

  <div v-else class="tree">
    <tree-node v-for="node in treeData" :key="node.path" :node="node"></tree-node>
  </div>

  <div class="footer">数据来源: <a href="https://github.com/algoux/srk-collection" target="_blank">algoux/srk-collection</a></div>
</div>

<script>
const CDN = 'https://cdn.jsdelivr.net/gh/algoux/srk-collection@master/';

const { createApp, ref, computed } = Vue;

const app = createApp({
  setup() {
    const loading = ref(true);
    const error = ref('');
    const treeData = ref([]);

    async function loadConfig() {
      try {
        const resp = await fetch(CDN + 'official/config.yaml', { cache: 'force-cache' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();
        const yaml = jsyaml.load(text);
        treeData.value = buildTree(yaml.root.children || [], '');
      } catch (e) {
        error.value = e.message;
      } finally {
        loading.value = false;
      }
    }

    function buildTree(children, parentPath) {
      return children.map(item => {
        const path = parentPath ? parentPath + '/' + item.path : item.path;
        const isLeaf = item.format === 'srk.json';
        const node = { name: item.name, path, isLeaf, children: [], count: 0 };
        if (item.children) {
          node.children = buildTree(item.children, path);
          node.count = countLeaves(node.children);
        }
        if (isLeaf) {
          node.filePath = 'official/' + path;
          node.count = 1;
        }
        return node;
      });
    }

    function countLeaves(nodes) {
      let c = 0;
      for (const n of nodes) { c += n.isLeaf ? 1 : countLeaves(n.children); }
      return c;
    }

    loadConfig();

    return { loading, error, treeData };
  }
});

app.component('tree-node', {
  props: ['node'],
  template: `
    <div class="tree-node">
      <div class="node-header" @click="toggle">
        <span class="node-arrow" :class="{ expanded: expanded, leaf: node.isLeaf }">&#9654;</span>
        <span class="node-label" :class="{ 'leaf-label': node.isLeaf }">{{ node.name }}</span>
        <span v-if="!node.isLeaf" class="node-count">{{ node.count }} 场</span>
        <span v-if="node.isLeaf" class="leaf-actions">
          <button class="btn-vp" @click.stop="goVP">开始 VP</button>
          <button class="btn-final" @click.stop="goFinal">最终榜单</button>
        </span>
      </div>
      <div v-if="expanded && node.children.length" class="node-children">
        <tree-node v-for="child in node.children" :key="child.path" :node="child"></tree-node>
      </div>
    </div>
  `,
  setup(props) {
    const expanded = ref(false);
    function toggle() { if (!props.node.isLeaf) expanded.value = !expanded.value; }
    function goVP() {
      const now = Date.now();
      window.location.href = 'board.html?comp=' + props.node.filePath + '&st=' + now;
    }
    function goFinal() {
      window.location.href = 'board.html?comp=' + props.node.filePath + '&st=0';
    }
    return { expanded, toggle, goVP, goFinal };
  }
});

app.mount('#app');
</script>
</body>
</html>
